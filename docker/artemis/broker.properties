# Applied on top of the image's generated broker.xml on every start (artemis run --properties).
# Same values as EmbeddedBrokerTestConfig in workload-service.
addressConfigurations."trainer.workload".routingTypes=ANYCAST
addressConfigurations."trainer.workload".queueConfigs."trainer.workload".address=trainer.workload
addressConfigurations."trainer.workload".queueConfigs."trainer.workload".routingType=ANYCAST
addressConfigurations."DLQ.trainer.workload".routingTypes=ANYCAST
addressConfigurations."DLQ.trainer.workload".queueConfigs."DLQ.trainer.workload".address=DLQ.trainer.workload
addressConfigurations."DLQ.trainer.workload".queueConfigs."DLQ.trainer.workload".routingType=ANYCAST

addressSettings."trainer.workload".maxDeliveryAttempts=3
addressSettings."trainer.workload".redeliveryDelay=500
addressSettings."trainer.workload".redeliveryMultiplier=2
addressSettings."trainer.workload".maxRedeliveryDelay=5000
addressSettings."trainer.workload".deadLetterAddress=DLQ.trainer.workload
