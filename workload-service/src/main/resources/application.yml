server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: workload-service
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  default-produces-media-type: application/json
