# No default URL on purpose: starting staging without DB_URL has to fail, not quietly
# connect to something on localhost.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.giorgi.gymcrm: INFO
    org.hibernate.SQL: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # components yes, their details no: a reader outside the team learns nothing useful
      show-details: never
