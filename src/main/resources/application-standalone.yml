# No external dependencies: in-memory H2, no DB_USERNAME or DB_PASSWORD needed. For the
# container image, where the app has to come up on its own.
spring:
  datasource:
    url: jdbc:h2:mem:gymcrm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616?connect-timeout-millis=1000&callTimeout=1000&useTopologyForLoadBalancing=false}
    user: ${ARTEMIS_USER:local-development-only-artemis}
    password: ${ARTEMIS_PASSWORD:local-development-only-artemis-password}
  jpa:
    hibernate:
      # Flyway makes Boot default this to none, which would quietly skip the check that the
      # migrations still match the entities. Every other profile validates, so this one does too.
      ddl-auto: validate

logging:
  level:
    com.giorgi.gymcrm: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

gymcrm:
  jwt:
    # Development only, and obviously so. JWT_SECRET overrides it.
    secret: ${JWT_SECRET:local-development-only-secret-change-me-0123456789}
  workload:
    jwt-secret: ${WORKLOAD_JWT_SECRET:local-development-only-workload-secret-change-me-0123456789}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
