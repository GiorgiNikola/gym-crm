# No default URL on purpose: starting production without DB_URL has to fail, not quietly
# connect to something on localhost.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.giorgi.gymcrm: INFO
    # quoted, or yaml reads it as the boolean false
    org.hibernate.SQL: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # components yes, their details no: a reader outside the team learns nothing useful
      show-details: never

# The api docs are a development aid: no spec and no UI once the app is deployed.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
