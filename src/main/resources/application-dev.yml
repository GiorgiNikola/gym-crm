# The shared development database. DB_URL may point it elsewhere.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymcrm_dev}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  artemis:
    mode: native
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616?connect-timeout-millis=1000&callTimeout=1000&useTopologyForLoadBalancing=false}
    user: ${ARTEMIS_USER:local-development-only-artemis}
    password: ${ARTEMIS_PASSWORD:local-development-only-artemis-password}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.giorgi.gymcrm: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

gymcrm:
  jwt:
    # Development only, and obviously so. JWT_SECRET overrides it.
    secret: ${JWT_SECRET:local-development-only-secret-change-me-0123456789}
  workload:
    jwt-secret: ${WORKLOAD_JWT_SECRET:local-development-only-workload-secret-change-me-0123456789}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
